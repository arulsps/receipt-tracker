# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy dotnet core project to Azure Function App - receipttracker-arul

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'src/ReceiptTracker.Functions' # Path to project containing .csproj
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write # Required for requesting the JWT via federated credentials
      contents: read  # Required for actions/checkout

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 'Publish Project Dependencies Using Dotnet'
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          dotnet publish --configuration Release --output ./output
          echo "=== Output directory contents ==="
          ls -la ./output
          if [ -f "./output/functions.metadata" ]; then
            echo "=== functions.metadata ==="
            cat ./output/functions.metadata
          else
            echo "WARNING: functions.metadata does not exist in output!"
          fi
          if [ -f "./output/worker.config.json" ]; then
            echo "=== worker.config.json ==="
            cat ./output/worker.config.json
          fi
          popd
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3EFE40D0BE4F4CF1BAD2CD5D3585E600 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9EF5562FF521451785EC8A168A2CFD09 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_96533A52C58C470E9BEA00C04C3027BB }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'receipttracker-arul'
          slot-name: 'Production'
          package: '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output'

      - name: 'Query Function App Config, Triggers and Keys'
        shell: bash
        run: |
          echo "=== Function App Config ==="
          az functionapp show --name receipttracker-arul --resource-group receipttracker-arul_group --query "properties.functionAppConfig" -o json || true
          
          echo "=== ARM Functions List (API 2023-12-01) ==="
          az rest --method get --uri "https://management.azure.com/subscriptions/909d161f-d059-4d43-ab1d-c7291a11c417/resourceGroups/receipttracker-arul_group/providers/Microsoft.Web/sites/receipttracker-arul/functions?api-version=2023-12-01" -o json || true

          echo "=== CLI Function List ==="
          az functionapp function list --name receipttracker-arul --resource-group receipttracker-arul_group -o table || true

          echo "=== Function Keys for UploadReceipt ==="
          az functionapp function keys list --name receipttracker-arul --resource-group receipttracker-arul_group --function-name UploadReceipt -o json || true
